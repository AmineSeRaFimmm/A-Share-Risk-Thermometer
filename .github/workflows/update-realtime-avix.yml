name: Update Realtime AVIX

# Professional reliability model:
# - Dense short "ticks" every ~10 minutes during A-share hours (not two long jobs/day).
# - If GitHub delays one schedule, the next tick still keeps data relatively fresh.
# - Outside the market window, schedule runs exit 0 (skip) instead of failing.
# - Manual dispatch performs one bounded update, matching a scheduled tick.

on:
  schedule:
    # Times are UTC. A-share: morning 09:15–11:35 CST, afternoon 12:50–15:10 CST.
    # Morning 01:15–03:35 UTC
    - cron: "15,25,35,45,55 1 * * 1-5"
    - cron: "5,15,25,35,45,55 2 * * 1-5"
    - cron: "5,15,25,35 3 * * 1-5"
    # Afternoon 04:50–07:05 UTC.
    - cron: "50,55 4 * * 1-5"
    - cron: "5,15,25,35,45,55 5 * * 1-5"
    # 06:40 builds the earliest stable warning; 06:50 opens the CORE tail window.
    - cron: "5,15,25,35,40,45,50,55 6 * * 1-5"
    - cron: "5 7 * * 1-5"
    # Dedicated close snapshots. Scheduled jobs can be delayed substantially on
    # free GitHub runners, so the gate identifies these ticks by their schedule.
    - cron: "16,26,46 7 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Deprecated compatibility input; every dispatch runs one bounded update"
        required: false
        default: "single"
        type: choice
        options:
          - single

permissions:
  contents: write
  actions: write

concurrency:
  # Every workflow that writes main shares one lock. This prevents an older
  # realtime checkout from racing the daily or ETF EOD publisher.
  group: risk-thermometer-main
  cancel-in-progress: false

jobs:
  update-realtime-avix:
    runs-on: ubuntu-latest
    # Session loops need headroom; single ticks finish in a few minutes.
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Decide whether to run
        id: gate
        run: |
          set -euo pipefail

          utc_now="$(date -u --iso-8601=seconds)"
          utc_hour="$(date -u +%H)"
          utc_minute="$(date -u +%M)"
          utc_total=$((10#$utc_hour * 60 + 10#$utc_minute))
          echo "UTC now=${utc_now} total_minutes=${utc_total}"

          # Padded windows so mildly delayed runners still update.
          # Morning: 01:15–03:40 UTC (09:15–11:40 CST)
          # Afternoon: 04:50–07:20 UTC (12:50–15:20 CST)
          in_morning=0
          in_afternoon=0
          if (( utc_total >= 75 && utc_total <= 220 )); then in_morning=1; fi
          if (( utc_total >= 290 && utc_total <= 440 )); then in_afternoon=1; fi

          event_name="${{ github.event_name }}"
          scheduled_cron="${{ github.event.schedule }}"
          if [[ "${event_name}" == "workflow_dispatch" ]]; then
            echo "Manual dispatch — run one bounded update."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Close ticks remain valid until 18:30 CST. The input sources retain
          # the same-day final quote, so a delayed free runner must catch up
          # instead of being discarded by the intraday wall-clock gate.
          if [[ "${scheduled_cron}" == "16,26,46 7 * * 1-5" ]] && (( utc_total <= 630 )); then
            echo "Scheduled close snapshot (catch-up allowed)."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # schedule: only tick inside market windows
          if (( in_morning == 1 )); then
            echo "Schedule tick inside morning window."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if (( in_afternoon == 1 )); then
            echo "Schedule tick inside afternoon window."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Outside A-share realtime window — skip (not a failure)."
          echo "should_run=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.gate.outputs.should_run == 'true'

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.should_run == 'true'
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update realtime AVIX
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          run_one_update() {
            git pull --rebase origin main

            if ! timeout 240s python scripts/update_realtime_avix.py; then
              echo "::warning::Realtime AVIX fetch/calc timed out or failed."
              return 1
            fi

            python scripts/validate_realtime_avix.py
            python scripts/stage_realtime_outputs.py

            if git diff --cached --quiet; then
              echo "No realtime AVIX changes to commit."
              return 0
            fi

            git commit -m "Update realtime AVIX"
            git pull --rebase --autostash origin main
            git push
            # Trigger Pages rebuild so live site sees nowcast sooner than next daily deploy.
            gh workflow run deploy-pages.yml --ref main \
              || echo "::warning::Could not trigger deploy-pages workflow"
            return 0
          }

          # One immediate retry inside the tick for transient network/source blips.
          if ! run_one_update && ! run_one_update; then
            echo "::error::Realtime AVIX did not complete successfully in this run."
            exit 1
          fi
          echo "Realtime AVIX completed successfully."
