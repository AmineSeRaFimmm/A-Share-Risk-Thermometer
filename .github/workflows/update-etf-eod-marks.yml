name: Update Flex ETF EOD Marks

on:
  schedule:
    # UTC. First attempt is 15:30 CST, followed by source-lag recovery ticks.
    - cron: "30,45 7 * * 1-5"
    - cron: "0,30 8 * * 1-5"
    - cron: "30 9 * * 1-5"
    - cron: "0,30 11 * * 1-5"
  workflow_dispatch:
    inputs:
      trade_date:
        description: "optional YYYY-MM-DD recovery target"
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: risk-thermometer-main
  cancel-in-progress: false

jobs:
  refresh-etf-eod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Refresh official ETF closes
        id: refresh
        run: |
          set +e
          target="${{ github.event.inputs.trade_date || '' }}"
          args=()
          if [[ -n "${target}" ]]; then args+=(--trade-date "${target}"); fi
          python scripts/update_etf_eod_marks.py "${args[@]}"
          rc=$?
          set -e
          if [[ ${rc} -eq 0 ]]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          elif [[ ${rc} -eq 2 ]]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Official ETF closes are not complete yet; a later tick will retry."
          else
            exit "${rc}"
          fi
      - name: Commit complete ETF marks
        if: steps.refresh.outputs.complete == 'true'
        id: commit
        run: |
          set -euo pipefail
          git config user.name "risk-thermometer-bot"
          git config user.email "actions@github.com"
          git add \
            data/site/etf_daily_marks.json data/site/flex_snapshot.json \
            docs/data/etf_daily_marks.json docs/data/flex_snapshot.json docs/data/build_info.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update Flex ETF EOD marks"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy updated marks
        if: steps.commit.outputs.changed == 'true'
        run: |
          gh workflow run deploy-pages.yml --ref main \
            || echo "::warning::Could not trigger deploy-pages workflow"
